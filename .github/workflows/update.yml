name: Update Daily Average
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-daily-average
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scarica i dati e calcola le medie dei giorni mancanti
        run: node scripts/update.js

      - name: Commit e Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json 20[0-9][0-9]/
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
            exit 0
          fi
          LATEST=$(node -p "require('./data.json').date")
          git commit -m "Update daily average ${LATEST}"
          git push
